[workspace]
resolver = "2"
members = [
    "crates/tok-core",
    "crates/tok-normalizers",
    "crates/tok-pretok",
    "crates/tok-models",
    "crates/tok-post",
    "crates/tok-decoders",
    "crates/tok-trainers",
    "crates/tok-pipeline",
    "crates/tok-compat",
    "crates/tok-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
fancy-regex = "0.13"
unicode-normalization = "0.1"
ahash = "0.8"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
tok-core = { path = "crates/tok-core" }
tok-normalizers = { path = "crates/tok-normalizers" }
tok-pretok = { path = "crates/tok-pretok" }
tok-models = { path = "crates/tok-models" }
tok-post = { path = "crates/tok-post" }
tok-decoders = { path = "crates/tok-decoders" }
tok-trainers = { path = "crates/tok-trainers" }
tok-pipeline = { path = "crates/tok-pipeline" }
tok-compat = { path = "crates/tok-compat" }

[profile.release]
opt-level = 3
lto = "thin"
